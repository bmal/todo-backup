[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-backup"
version = "0.1.0"
description = "Mirror Microsoft To Do to local JSON snapshots and Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
todo-backup = "todo_backup.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
